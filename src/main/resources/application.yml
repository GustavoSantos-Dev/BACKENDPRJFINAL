server:
  port: ${SERVER_PORT:8080}
spring:
  config:
    import: 'optional:file:./.env[.properties]'
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/production?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${DB_USER:production}
    password: ${DB_PASSWORD}
  data:
    web:
      pageable:
        max-page-size: 200
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.type.preferred_instant_jdbc_type: TIMESTAMP
  flyway:
    enabled: true
app:
  jwt-secret: ${JWT_SECRET}
  issuer: production-counter
  zone: America/Sao_Paulo
  cors-origins: ${CORS_ORIGINS:http://localhost:5173}
  bootstrap-email: ${BOOTSTRAP_ADMIN_EMAIL:}
  bootstrap-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
